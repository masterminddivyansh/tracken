<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f7f8fc">
  <title>404 — Page Not Found | TRACKEN WORKSPACE</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
  <style>
    :root{color-scheme:light;--bg:#f7f8fc;--surface:rgba(255,255,255,.88);--text:#11121a;--muted:#666a79;--line:#e0e2eb;--accent:#6555e9}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    body{background:radial-gradient(circle at 50% 20%,rgba(111,82,246,.12),transparent 34%),var(--bg)}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(650px,100%);padding:42px;border:1px solid var(--line);border-radius:28px;background:var(--surface);backdrop-filter:blur(18px);box-shadow:0 28px 90px rgba(40,32,90,.12)}
    .brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.045em;font-size:25px}.brand img{width:42px;height:42px;object-fit:contain}.brand span{color:var(--accent)}
    .eyebrow{margin-top:38px;font-size:10px;letter-spacing:.2em;font-weight:800;color:var(--accent)}
    h1{font-size:clamp(44px,8vw,72px);line-height:.9;letter-spacing:-.065em;margin:13px 0 18px}p{max-width:540px;color:var(--muted);line-height:1.7;margin:0 0 26px}
    a{display:inline-flex;align-items:center;gap:9px;padding:14px 19px;border-radius:13px;background:var(--accent);color:white;text-decoration:none;font-weight:800;box-shadow:0 12px 30px rgba(101,85,233,.24)}
    @media(max-width:560px){.card{padding:30px 24px;border-radius:22px}.brand{font-size:22px}.brand img{width:36px;height:36px}h1{font-size:52px}}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0b0c10;--surface:rgba(20,22,30,.92);--text:#f6f7fb;--muted:#a8abb8;--line:#2c2f3a;--accent:#8b78ff}body{background:radial-gradient(circle at 50% 20%,rgba(101,85,233,.2),transparent 36%),var(--bg)}.card{box-shadow:0 30px 100px rgba(0,0,0,.38)}}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="not-found-title">
      <div class="brand"><img src="/tracken-logo.png" alt="TRACKEN logo">TRACKEN<span>.</span></div>
      <div class="eyebrow">TRACKEN WORKSPACE · 404</div>
      <h1 id="not-found-title">Page not found.</h1>
      <p>The address you opened does not match a public TRACKEN page. Check the URL or return to the workspace.</p>
      <a href="/">Back to TRACKEN →</a>
    </section>
  </main>
</body>
</html>
